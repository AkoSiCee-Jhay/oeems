<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRC - Dashboard / Setup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="user-profile">
        <div class="avatar-circle"><i class="bi bi-person-fill"></i></div>
        <div class="user-info">
          <h3>Juan Dela Cruz</h3>
          <span class="user-role">Applicant</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="active"><a href="dashboard.html"><i class="bi bi-house-door-fill"></i> <span>Dashboard / Setup</span></a></li>
          <li ><a href="upload-files.html"><i class="bi bi-file-earmark-arrow-up-fill"></i> <span>Upload Files</span></a></li>
          <li ><a href="schedule-exam.html"><i class="bi bi-calendar-event-fill"></i> <span>Schedule Exam</span></a></li>
          <li ><a href="print-files.html"><i class="bi bi-printer-fill"></i> <span>Print Files (SOA)</span></a></li>
          <li ><a href="report-problem.html"><i class="bi bi-envelope-fill"></i> <span>Report a Problem</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="logout-link"><i class="bi bi-box-arrow-left"></i> <span>Log Out</span></a>
      </div>
    </aside>
    <main class="main-content">
      
      <header class="welcome-banner">
        <h2>Welcome, GRCians! 👏</h2>
        <p>Complete your application steps below to secure your entrance exam slot.</p>
      </header>
      <div class="card">
        <h3 class="card-title">Complete Student Information</h3>
        <form id="setupForm">
          <div class="form-group">
            <label>Sex:</label>
            <div class="radio-group">
              <label><input type="radio" name="sex" value="Male" checked /> Male</label>
              <label><input type="radio" name="sex" value="Female" /> Female</label>
            </div>
          </div>
          <div class="form-group">
            <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number:</label>
            <div class="phone-input-group">
              <span class="prefix">+63</span>
              <input type="tel" id="phone" class="form-control" placeholder="9123456789" required />
            </div>
          </div>
          <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" class="form-control" placeholder="Barangay, City, Province" required />
          </div>
          <button type="submit" class="btn-submit">Save Profile</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/sidebar.js"></script>
</body>
</html>
