<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OEEMS - Log In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>
<body class="login-body">

  <nav class="grc-navbar">
    <div class="grc-navbar-inner">
      <a class="grc-navbar-brand" href="index.html">
        <img src="/assets/image/grc-logo.png" alt="GRC Logo" class="grc-navbar-logo" />
        <span>OEEMS</span>
      </a>
      <ul class="grc-navbar-nav">
        <li><a href="index.html">Home</a></li>
      </ul>
    </div>
  </nav>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>LOG-IN</h2>
      <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="e.g. juandelacruz@gmail.com" required />

        <label for="password">Password:</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Password you created" required />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <p class="forgot-pass-container">
          <a href="#" id="forgotPasswordBtn">Forgot password?</a>
        </p>

        <button type="submit" class="btn-login">Log-in</button>

        <p class="signup-link-container">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </form>
      <p id="message"></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
